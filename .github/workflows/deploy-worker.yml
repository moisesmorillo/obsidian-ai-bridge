name: Deploy released Worker

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to deploy (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: worker-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate release and deploy Worker
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.release.prerelease == false && vars.WORKER_AUTO_DEPLOY == 'true') }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out the published release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.release.tag_name }}
          fetch-depth: 0

      - name: Verify release tag is current main
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Install repository tools
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install locked dependencies
        run: mise run install

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.release.tag_name }}
        run: test "$RELEASE_TAG" = "v$(node -p 'require("./package.json").version')"

      - name: Validate released source and identity
        run: mise run check

      - name: Deploy existing R2-bound Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: mise run worker:deploy
