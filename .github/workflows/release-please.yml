name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      plugin-created: ${{ steps.release.outputs['apps/plugin--release_created'] }}
      plugin-tag: ${{ steps.release.outputs['apps/plugin--tag_name'] }}
      worker-created: ${{ steps.release.outputs['apps/worker--release_created'] }}
      pull-requests: ${{ steps.release.outputs.prs }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release-plugin:
    needs: release-please
    if: ${{ needs.release-please.outputs.plugin-created == 'true' }}
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.plugin-tag }}
    permissions:
      contents: write
      pull-requests: write

  deploy-worker:
    needs: release-please
    if: ${{ needs.release-please.outputs.worker-created == 'true' }}
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      id-token: write
    secrets: inherit
