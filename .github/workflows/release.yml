name: Plugin release

on:
  push:
    tags:
      - 'ai-bridge-v*'
  workflow_call:
    inputs:
      tag:
        description: Release tag to verify and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: plugin-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.8
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Write tag compatibility entry
        run: bun apps/plugin/tools/release-versions.ts apps/plugin/manifest.json apps/plugin/versions.json
      - name: Validate release metadata
        env:
          PLUGIN_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: bun apps/plugin/tools/release.ts "${PLUGIN_RELEASE_TAG:?Missing release tag}"
      - name: Check repository and build plugin
        run: bun run check
      - name: Upload checked plugin assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-release-assets
          path: |
            apps/plugin/dist/manifest.json
            apps/plugin/dist/main.js
          if-no-files-found: error
          retention-days: 1
          overwrite: false

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: true
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.8
      - name: Verify tag source
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:?Missing release tag}"
          checked_commit="$(git rev-parse HEAD)"
          remote_tag_commit="$(git ls-remote origin "refs/tags/${tag}^{}" "refs/tags/${tag}" | awk 'substr($2, length($2) - 2) == "^{}" { peeled = $1 } substr($2, length($2) - 2) != "^{}" { direct = $1 } END { if (peeled != "") print peeled; else print direct }')"
          if [ "$checked_commit" != "${GITHUB_SHA:?Missing workflow commit}" ]; then
            echo "Checked checkout does not match the workflow commit." >&2
            exit 1
          fi
          if [ -z "$remote_tag_commit" ] || [ "$remote_tag_commit" != "$checked_commit" ]; then
            echo "Remote tag does not match the checked commit." >&2
            exit 1
          fi
      - name: Download checked plugin assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-release-assets
          path: apps/plugin/dist
      - name: Publish release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:?Missing release tag}"
          if gh release view "$tag" >/dev/null 2>&1; then
            assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"
            download_dir="$(mktemp -d)"
            trap 'rm -rf "$download_dir"' EXIT
            for file in apps/plugin/dist/manifest.json apps/plugin/dist/main.js; do
              name="$(basename "$file")"
              if printf '%s\n' "$assets" | grep -Fxq "$name"; then
                gh release download "$tag" --pattern "$name" --dir "$download_dir"
                if ! cmp -s "$file" "$download_dir/$name"; then
                  echo "Published asset ${name} differs from the checked release asset." >&2
                  exit 1
                fi
              else
                gh release upload "$tag" "$file"
              fi
            done
          else
            gh release create "$tag" \
              --verify-tag \
              --title "$tag" \
              --notes "Plugin release $tag." \
              apps/plugin/dist/manifest.json \
              apps/plugin/dist/main.js
          fi
      - name: Record published compatibility entry on main
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:?Missing release tag}"
          manifest="$(mktemp)"
          trap 'rm -f "$manifest"' EXIT
          git show "${tag}:apps/plugin/manifest.json" > "$manifest"
          release_version="$(bun -e 'const manifest = JSON.parse(await Bun.file(process.argv[1]).text()); console.log(manifest.version)' "$manifest")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          attempt=0
          while [ "$attempt" -lt 3 ]; do
            git fetch origin main
            git switch --detach FETCH_HEAD
            bun apps/plugin/tools/release-versions.ts "$manifest" apps/plugin/versions.json
            if git diff --quiet -- apps/plugin/versions.json; then
              echo "Compatibility entry ${release_version} already exists on main."
              exit 0
            fi
            git add apps/plugin/versions.json
            git commit -m "chore(plugin): record compatibility for ${release_version}"
            if git push origin HEAD:main; then exit 0; fi
            attempt=$((attempt + 1))
          done
          branch="chore/plugin-compatibility-${release_version}"
          if gh pr list --state open --head "$branch" --json url --jq '.[0].url' | grep -q .; then
            echo "Compatibility PR already exists for ${release_version}."
            exit 0
          fi
          git fetch origin main
          git switch --detach FETCH_HEAD
          bun apps/plugin/tools/release-versions.ts "$manifest" apps/plugin/versions.json
          if git diff --quiet -- apps/plugin/versions.json; then exit 0; fi
          git add apps/plugin/versions.json
          git commit -m "chore(plugin): record compatibility for ${release_version}"
          git push origin "HEAD:refs/heads/${branch}"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore(plugin): record compatibility for ${release_version}" \
            --body "Record the compatibility entry for the published plugin tag ${tag}."
