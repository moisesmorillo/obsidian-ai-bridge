[tools]
bun = "1.4.2"
node = "24.21.0"

[tasks.install]
description = "Install locked workspace dependencies"
run = "bun install --frozen-lockfile"

[tasks.format]
description = "Apply Biome formatting"
run = "bunx biome format --write ."

[tasks."biome:check"]
description = "Check Biome formatting, linting, and configured assists"
run = "bunx biome check ."

[tasks.lint]
description = "Run type-aware Oxlint semantic checks"
run = "bunx oxlint --type-aware --deny-warnings ."

[tasks.typecheck]
description = "Type-check every workspace"
run = """
bunx tsc --noEmit -p tsconfig.json
bunx tsc --noEmit -p apps/obsidian-plugin/tsconfig.json
bunx tsc --noEmit -p apps/obsidian-plugin/tests/artifact/tsconfig.json
"""

[tasks.test]
description = "Run the fast Vitest test suite"
run = "bunx vitest run"

[tasks.coverage]
description = "Run Vitest with V8 coverage and enforce thresholds"
run = "node node_modules/vitest/vitest.mjs run --coverage"

[tasks.build]
description = "Build the Worker and smoke-check the packaged Obsidian plugin without deploying"
depends = ["worker:build", "plugin:smoke"]

[tasks."worker:build"]
description = "Bundle the Cloudflare Worker without deploying it"
run = "node apps/worker/node_modules/wrangler/bin/wrangler.js deploy --dry-run --config apps/worker/wrangler.jsonc"

[tasks."plugin:build"]
description = "Bundle the local-only plugin as browser-compatible CommonJS and stage its manifest"
run = """
bun build apps/obsidian-plugin/src/main.ts --target browser --format cjs --outdir apps/obsidian-plugin/dist --external obsidian
cp apps/obsidian-plugin/manifest.json apps/obsidian-plugin/dist/manifest.json
"""

[tasks."plugin:smoke"]
description = "Load the packaged plugin with an isolated Obsidian host double"
depends = ["plugin:build"]
run = "node node_modules/vitest/vitest.mjs run --config apps/obsidian-plugin/vitest.smoke.config.ts"

[tasks.dev]
description = "Run the Worker with Wrangler local development"
run = "node apps/worker/node_modules/wrangler/bin/wrangler.js dev --config apps/worker/wrangler.jsonc"

[tasks.check]
description = "Run the complete repository validation pipeline"
depends = ["biome:check", "lint", "typecheck", "coverage", "build"]
